<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>居家血壓記錄 BP Log</title>
<meta name="description" content="Home blood pressure log. Data stays on this phone.">
<meta name="theme-color" content="#b42318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="血壓記錄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --ink:#1d1b19; --muted:#6b6560; --line:#e4dfd9;
  --accent:#b42318; --accent-ink:#ffffff; --accent-soft:#fdecea;
  --sys:#c0392b; --dia:#2563a8; --pulse:#7a7a7a;
  --ok:#1f7a3f; --ok-bg:#e6f4ea; --warn:#8a6100; --warn-bg:#fff4d6;
  --high:#b54708; --high-bg:#ffead5; --vhigh:#b42318; --vhigh-bg:#fde2e0;
  --low:#2563a8; --low-bg:#e3eefb;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151413; --card:#211f1d; --ink:#f2efeb; --muted:#a8a29c; --line:#36322f;
    --accent:#f05a4a; --accent-ink:#1a0806; --accent-soft:#3a1d1a;
    --sys:#ff7a6b; --dia:#6aa8f0; --pulse:#aaa;
    --ok:#6fd38f; --ok-bg:#16301f; --warn:#f2c94c; --warn-bg:#3a3014;
    --high:#ffa46b; --high-bg:#3c2414; --vhigh:#ff7a6b; --vhigh-bg:#40191a;
    --low:#7fb6f5; --low-bg:#172a40;
  }
}
:root[data-theme="dark"]{
  --bg:#151413; --card:#211f1d; --ink:#f2efeb; --muted:#a8a29c; --line:#36322f;
  --accent:#f05a4a; --accent-ink:#1a0806; --accent-soft:#3a1d1a;
  --sys:#ff7a6b; --dia:#6aa8f0; --pulse:#aaa;
  --ok:#6fd38f; --ok-bg:#16301f; --warn:#f2c94c; --warn-bg:#3a3014;
  --high:#ffa46b; --high-bg:#3c2414; --vhigh:#ff7a6b; --vhigh-bg:#40191a;
  --low:#7fb6f5; --low-bg:#172a40;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  font-size:18px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom));}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:20px;margin:0;flex:1;font-weight:700}
header.top .lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:15px}
main{max-width:640px;margin:0 auto;padding:12px 16px}
section.tab{display:none}
section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.card h2{font-size:18px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:15px}
/* entry */
.bpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.bpgrid > *{min-width:0}
input[type=datetime-local]{min-width:0;max-width:100%}
.field label{display:block;font-size:16px;font-weight:600;margin-bottom:4px}
.field label .unit{font-weight:400;color:var(--muted);font-size:14px}
.num{width:100%;font-size:40px;font-weight:700;text-align:center;padding:10px 6px;border-radius:12px;
  border:2px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.num:focus{outline:none;border-color:var(--accent)}
#inSys{color:var(--sys)} #inDia{color:var(--dia)}
.field.wide{grid-column:1 / -1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=datetime-local],input[type=number].plain,textarea{width:100%;font-size:17px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:16px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:10px;font-size:17px;padding:6px 0}
.check input{width:26px;height:26px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;
  font-size:18px;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);font-family:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%;font-size:22px;padding:16px}
.btn.block{width:100%}
.btn.danger{color:var(--vhigh)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--vhigh);font-weight:600;min-height:1.4em;margin:8px 0 0}
/* level badge */
.lv{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.lv-ok{background:var(--ok-bg);color:var(--ok)} .lv-warn{background:var(--warn-bg);color:var(--warn)}
.lv-high{background:var(--high-bg);color:var(--high)} .lv-vhigh,.lv-crisis{background:var(--vhigh-bg);color:var(--vhigh)}
.lv-low{background:var(--low-bg);color:var(--low)}
.result{border-radius:var(--radius);padding:16px;margin:0 0 14px;border:2px solid transparent}
.result .big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.result.lv-crisis{border-color:var(--vhigh)}
/* list */
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rlist li:first-child{border-top:0}
.rlist .when{width:62px;font-size:15px;color:var(--muted);flex:none}
.rlist .bp{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.rlist .bp .s{color:var(--sys)} .rlist .bp .d{color:var(--dia)}
.rlist .meta{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.rlist .del{border:0;background:none;color:var(--muted);font-size:22px;padding:4px 8px;cursor:pointer}
.dayhead{font-weight:700;margin:16px 0 4px;font-size:16px}
/* report */
.rep-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.rep-head h2{margin:0;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat .k{font-size:14px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted)}
.stat.main{grid-column:1 / -1;background:var(--accent-soft)}
.stat.main .v{font-size:40px}
.chart{width:100%;height:auto;display:block}
table.days{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
table.days th,table.days td{padding:7px 4px;border-top:1px solid var(--line);text-align:center}
table.days th{font-size:14px;color:var(--muted);font-weight:600}
table.days td:first-child,table.days th:first-child{text-align:left;white-space:nowrap}
table.days td:last-child{min-width:4em}
.hi{color:var(--vhigh);font-weight:800}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{border:0;background:none;color:var(--muted);padding:8px 2px 10px;font-size:13px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button svg{width:26px;height:26px}
nav.bottom button.on{color:var(--accent);font-weight:700}
.howto{margin:0;padding-left:1.3em}
.howto li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.print-only{display:none}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--muted:#444;--line:#bbb;--accent-soft:#f3f3f3}
  body{padding:0;font-size:12pt;background:#fff}
  header.top,nav.bottom,.no-print,.toast{display:none!important}
  section.tab{display:none!important}
  section#tab-report{display:block!important}
  .card{border:0;padding:0;margin:0 0 10pt;break-inside:avoid}
  main{max-width:none;padding:0}
  .print-only{display:block}
  .stat{border:1px solid #ccc}
}
</style>
</head>
<body>
<header class="top">
  <h1 data-i="appName">居家血壓記錄</h1>
  <button class="lang" id="langBtn" type="button">English</button>
</header>

<main>
<!-- ========== ADD ========== -->
<section class="tab on" id="tab-add">
  <div id="resultBox"></div>

  <div class="card">
    <div class="bpgrid">
      <div class="field">
        <label for="inSys"><span data-i="sys">收縮壓 (高)</span> <span class="unit">mmHg</span></label>
        <input class="num" id="inSys" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="120">
      </div>
      <div class="field">
        <label for="inDia"><span data-i="dia">舒張壓 (低)</span> <span class="unit">mmHg</span></label>
        <input class="num" id="inDia" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="80">
      </div>
      <div class="field">
        <label for="inPulse"><span data-i="pulse">心跳</span> <span class="unit" data-i="bpm">次/分</span></label>
        <input class="num" id="inPulse" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="70" style="font-size:32px">
      </div>
      <div class="field" style="align-self:end">
        <label for="inTime" data-i="time">時間</label>
        <input id="inTime" type="datetime-local" style="padding:14px 8px">
        <div class="small muted" id="periodHint"></div>
      </div>
      <div class="field wide">
        <label class="check"><input type="checkbox" id="inMed"> <span data-i="medTaken">今天已吃血壓藥</span></label>
        <label class="check"><input type="checkbox" id="inIrr"> <span data-i="irregular">血壓計顯示心律不整</span></label>
      </div>
      <div class="field wide">
        <label data-i="note">備註（可不填）</label>
        <div class="chips" id="noteChips"></div>
        <input type="text" id="inNote" style="margin-top:8px" data-ph="notePh" placeholder="例如：頭暈、睡不好">
      </div>
    </div>
    <p class="err" id="addErr" role="alert"></p>
    <button class="btn primary" id="saveBtn" type="button" data-i="save">儲存</button>
  </div>

  <div class="card">
    <h2 data-i="recent">最近記錄</h2>
    <ul class="rlist" id="recentList"></ul>
  </div>

  <div class="card">
    <h2 data-i="howTitle">怎麼量才準？「722」原則</h2>
    <ol class="howto" id="howList"></ol>
  </div>
</section>

<!-- ========== HISTORY ========== -->
<section class="tab" id="tab-history">
  <div class="card">
    <h2 data-i="allRecords">全部記錄</h2>
    <div id="historyList"></div>
  </div>
</section>

<!-- ========== REPORT ========== -->
<section class="tab" id="tab-report">
  <div class="card no-print">
    <div class="small muted" data-i="periodPick">期間</div>
    <div class="chips" id="rangeChips" style="margin-top:6px"></div>
  </div>
  <div class="card" id="reportCard"></div>
  <div class="card no-print">
    <div class="btns">
      <button class="btn" id="shareTextBtn" type="button" data-i="shareText">傳送摘要 (LINE)</button>
      <button class="btn" id="printBtn" type="button" data-i="print">列印 / 存 PDF</button>
      <button class="btn" id="csvBtn" type="button" data-i="csv">匯出表格 (CSV)</button>
      <button class="btn" id="fullBtn" type="button" data-i="bigView">放大給醫師看</button>
    </div>
  </div>
</section>

<!-- ========== SETTINGS ========== -->
<section class="tab" id="tab-settings">
  <div class="card" id="installCard">
    <h2 data-i="installTitle">安裝到手機主畫面</h2>
    <button class="btn block primary" id="installBtn" type="button" style="display:none;margin-bottom:10px" data-i="installNow">安裝</button>
    <div id="installHow"></div>
  </div>

  <div class="card">
    <h2 data-i="profile">我的資料（顯示在報告上）</h2>
    <div class="field"><label for="pfName" data-i="name">姓名</label><input type="text" id="pfName" autocomplete="name"></div>
    <div class="field" style="margin-top:10px"><label for="pfBirth" data-i="birth">出生年（西元）</label><input type="text" id="pfBirth" inputmode="numeric" maxlength="4"></div>
    <div class="field" style="margin-top:10px"><label for="pfMeds" data-i="meds">目前血壓藥（名稱、劑量、時間）</label><textarea id="pfMeds"></textarea></div>
    <div class="field" style="margin-top:10px">
      <label data-i="target">醫師給的居家目標血壓</label>
      <div class="row">
        <input type="text" class="num" id="pfTS" inputmode="numeric" maxlength="3" style="font-size:24px;width:96px;padding:6px"> <span style="font-size:24px">/</span>
        <input type="text" class="num" id="pfTD" inputmode="numeric" maxlength="3" style="font-size:24px;width:96px;padding:6px">
        <span class="muted small">mmHg</span>
      </div>
      <div class="small muted" data-i="targetHint">不確定就用 130/80，回診時請醫師幫您填。</div>
    </div>
  </div>

  <div class="card">
    <h2 data-i="backup">備份（換手機前請先做）</h2>
    <p class="small muted" data-i="privacy">記錄只存在這支手機裡，不會上傳到任何地方。刪除這個 App 或清除瀏覽器資料，記錄就會不見。</p>
    <div class="btns">
      <button class="btn" id="exportBtn" type="button" data-i="exportBk">匯出備份檔</button>
      <button class="btn" id="importBtn" type="button" data-i="importBk">從備份檔還原</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <div class="card">
    <h2 data-i="display">顯示</h2>
    <div class="chips" id="themeChips"></div>
  </div>

  <div class="card">
    <button class="btn block danger" id="wipeBtn" type="button" data-i="wipe">刪除全部記錄</button>
  </div>
  <p class="small muted" style="text-align:center" data-i="disclaimer">本工具僅供記錄，不能取代醫師診斷。</p>
</section>
</main>

<nav class="bottom" id="nav">
  <button type="button" data-tab="add" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    <span data-i="navAdd">記錄</span></button>
  <button type="button" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
    <span data-i="navHistory">歷史</span></button>
  <button type="button" data-tab="report">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
    <span data-i="navReport">給醫師看</span></button>
  <button type="button" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
    <span data-i="navSettings">我的</span></button>
</nav>
<div class="toast" id="toast"></div>

/* ---------------- storage ---------------- */
var storageOK = true;
function blank(){ return {v:1, readings:[], profile:{name:'',birth:'',meds:'',ts:130,td:80}, lang:null, theme:'auto', range:7}; }
function load(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ storageOK = false; }
  var b = blank();
  if (!s || typeof s !== 'object') return b;
  if (!Array.isArray(s.readings)) s.readings = [];
  s.profile = Object.assign(b.profile, s.profile || {});
  if (!s.theme) s.theme = 'auto';
  if (!s.range) s.range = 7;
  return s;
}
var S = load();
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; toast(t('storageErr'), 5000); }
}
try { localStorage.setItem(KEY+'.probe','1'); localStorage.removeItem(KEY+'.probe'); } catch(e){ storageOK = false; }

function pad(n){ return (n<10?'0':'')+n; }
var WD = {zh:['日','一','二','三','四','五','六'], en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
function fDate(ms){ var d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate()+(lang==='zh'?'（'+WD.zh[d.getDay()]+'）':' '+WD.en[d.getDay()]); }
function fDateY(ms){ var d=new Date(ms); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function fTime(ms){ var d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function dayKey(ms){ var d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function localInput(ms){ var d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function parseLocal(v){ var m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(v||''); if(!m) return NaN; return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime(); }
function isAM(ms){ var h=new Date(ms).getHours(); return h>=3 && h<12; }
function mean(a){ if(!a.length) return null; var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return Math.round(s/a.length); }
function sorted(){ return S.readings.slice().sort(function(a,b){ return b.t-a.t; }); }
function num(v){ v=String(v||'').replace(/[^\d]/g,''); return v===''?null:parseInt(v,10); }
function target(){ return {s: S.profile.ts||130, d: S.profile.td||80}; }

/* Home BP categories (home readings; 130/80 = Taiwan 2022 home threshold). */
function level(s,d){
  if (s>=180 || d>=110) return 'crisis';
  if (s>=160 || d>=100) return 'vhigh';
  var tg = target();
  if (s>=Math.min(130,tg.s) || d>=Math.min(80,tg.d)) return 'high';
  if (s<90 || d<60) return 'low';
  if (s>=120) return 'warn';
  return 'ok';
}
function badge(s,d){ var l=level(s,d); return '<span class="lv lv-'+l+'">'+esc(t('lv')[l])+'</span>'; }

var toastTimer;
function toast(msg, ms, action){
  var el=$('toast'); el.innerHTML=esc(msg); el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove('on'); }, ms||2200);
}

$('saveBtn').addEventListener('click', function(){
  var s=num($('inSys').value), d=num($('inDia').value), p=num($('inPulse').value), err=$('addErr');

  var ms = parseLocal($('inTime').value); if (isNaN(ms)) ms = Date.now();
  var notes = [], list = t('chipsNote');
  for (var k in noteSel) if (noteSel[k]) notes.push(list[k]);
  var free = $('inNote').value.trim(); if (free) notes.push(free);

  var r = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), t: ms, s: s, d: d};
  if (p!==null) r.p = p;
  if ($('inMed').checked) r.med = true;
  if ($('inIrr').checked) r.irr = true;
  if (notes.length) r.note = notes.join('、');
  S.readings.push(r); persist();
  var second = prev && Math.abs(ms - prev.t) < 10*60*1000;
  showResult(r, second);
  $('inSys').value=''; $('inDia').value=''; $('inPulse').value=''; $('inNote').value=''; $('inIrr').checked=false;
  noteSel={}; renderChips(); resetTime();

function showResult(r, second){

function rowHTML(r, withDate){

}

var RANGES = [7,14,30,90,0];

$('rangeChips').addEventListener('click', function(e){

});
function inRange(){
  var a = sorted(); if (!S.range) return a;
  var start = new Date(); start.setHours(0,0,0,0); start = start.getTime() - (S.range-1)*86400000;
  return a.filter(function(r){ return r.t>=start; });
}
function computeStats(a){
  var tg = target();
  var am = a.filter(function(r){ return isAM(r.t); }), pm = a.filter(function(r){ return !isAM(r.t); });
  var pick = function(arr,k){ return arr.map(function(r){ return r[k]; }).filter(function(v){ return v!=null; }); };
  var days = {}; a.forEach(function(r){ days[dayKey(r.t)] = 1; });
  var over = a.filter(function(r){ return r.s>=tg.s || r.d>=tg.d; }).length;
  var max = a.reduce(function(m,r){ return !m || r.s>m.s ? r : m; }, null);
  var min = a.reduce(function(m,r){ return !m || r.s<m.s ? r : m; }, null);
  return {
    n:a.length, days:Object.keys(days).length,
    s:mean(pick(a,'s')), d:mean(pick(a,'d')), p:mean(pick(a,'p')),
    amS:mean(pick(am,'s')), amD:mean(pick(am,'d')), amN:am.length,
    pmS:mean(pick(pm,'s')), pmD:mean(pick(pm,'d')), pmN:pm.length,
    over:over, overPct: a.length? Math.round(over*100/a.length) : 0, max:max, min:min,
    irr:a.filter(function(r){ return r.irr; }).length
  };
}
function bpTxt(s,d){ return s==null ? '–' : s+'/'+d; }
function hiCls(s,d){ var tg=target(); return (s!=null && (s>=tg.s || d>=tg.d)) ? ' class="hi"' : ''; }

function chartSVG(a){
  if (a.length<2) return '';
  var tg = target(), W=360, H=220, L=30, R=6, Tp=10, B=24;
  var pts = a.slice().sort(function(x,y){ return x.t-y.t; });
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  if (S.range){ var st=new Date(); st.setHours(0,0,0,0); t0 = Math.min(t0, st.getTime()-(S.range-1)*86400000); var en=new Date(); en.setHours(23,59,59,0); t1=Math.max(t1,en.getTime()); }
  if (t1-t0 < 3600000) t1 = t0 + 3600000;
  var lo=200, hi=0; pts.forEach(function(r){ lo=Math.min(lo,r.d); hi=Math.max(hi,r.s); });
  lo = Math.floor(Math.min(lo, tg.d-10, 60)/20)*20; hi = Math.ceil(Math.max(hi, tg.s+10, 160)/20)*20;
  var x=function(ms){ return L+(ms-t0)/(t1-t0)*(W-L-R); }, y=function(v){ return Tp+(hi-v)/(hi-lo)*(H-Tp-B); };
  var g='';
  for (var v=lo; v<=hi; v+=20){ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+v+'</text>'; }
  // date ticks
  var span = (t1-t0)/86400000, step = span<=8?1: span<=16?2: span<=35?7: span<=100?14:30;
  var d0 = new Date(t0); d0.setHours(0,0,0,0);
  for (var dt=d0.getTime(), i=0; dt<=t1; dt+=86400000, i++){
    if (dt<t0 || i%step) continue;
    var dd=new Date(dt); g+='<text x="'+x(dt+43200000)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</text>';
  }
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(tg.s)+'" y2="'+y(tg.s)+'" stroke="var(--sys)" stroke-dasharray="5 4" stroke-width="1.5" opacity=".7"/>';
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(tg.d)+'" y2="'+y(tg.d)+'" stroke="var(--dia)" stroke-dasharray="5 4" stroke-width="1.5" opacity=".7"/>';
  var line=function(k,col){
    var p = pts.map(function(r){ return x(r.t).toFixed(1)+','+y(r[k]).toFixed(1); }).join(' ');
    var dots = pts.map(function(r){ return '<circle cx="'+x(r.t).toFixed(1)+'" cy="'+y(r[k]).toFixed(1)+'" r="3.5" fill="'+col+'"/>'; }).join('');
    return '<polyline points="'+p+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" opacity=".55"/>'+dots;
  };
  g += line('s','var(--sys)') + line('d','var(--dia)');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('chartTitle'))+'">'+g+'</svg>';
}

function dailyRows(a){
  var by = {};
  a.forEach(function(r){ var k=dayKey(r.t); (by[k]=by[k]||{t:r.t,am:[],pm:[],notes:[],med:false})[isAM(r.t)?'am':'pm'].push(r);
    if (r.note) by[k].notes.push(r.note); if (r.irr) by[k].notes.push(t('irrLbl')); if (r.med) by[k].med=true; });
  return Object.keys(by).sort().reverse().map(function(k){
    var o=by[k], cell=function(arr){ if(!arr.length) return '<td class="muted">–</td>';
      var s=mean(arr.map(function(r){return r.s;})), d=mean(arr.map(function(r){return r.d;}));
      return '<td'+hiCls(s,d)+' style="white-space:nowrap">'+s+'/'+d+(arr.length>1?'<sup class="muted" style="font-size:11px;font-weight:400">'+arr.length+'</sup>':'')+'</td>'; };
    var uniq = o.notes.filter(function(v,i,s){ return s.indexOf(v)===i; });
    return '<tr><td>'+fDate(o.t)+'</td>'+cell(o.am)+cell(o.pm)+'<td class="small" style="text-align:left">'+esc(uniq.join('、'))+'</td></tr>';
  }).join('');
}

function renderReport(){
  renderRangeChips();
  var a = inRange(), st = computeStats(a), tg = target(), p = S.profile;
  var who = [];
  if (p.name) who.push('<b>'+esc(p.name)+'</b>');
  if (p.birth) who.push(t('ageLbl')+' '+esc(p.birth));
  var span = a.length ? fDateY(a[a.length-1].t)+' – '+fDateY(a[0].t) : '';
  var h = '<div class="rep-head"><h2>'+esc(t('report'))+'</h2><div class="muted small">'+who.join(' · ')+'</div></div>'+
    '<div class="muted small">'+esc(t('period'))+'：'+esc(span)+(S.range? '（'+S.range+' '+esc(t('days'))+'）':'')+' · '+esc(t('targetLbl'))+' '+tg.s+'/'+tg.d+'</div>';
  if (p.meds) h += '<div class="small" style="margin-top:6px"><b>'+esc(t('medsLbl'))+'：</b>'+esc(p.meds).replace(/\n/g,'；')+'</div>';
  if (!a.length){ $('reportCard').innerHTML = h + '<div class="empty">'+esc(t('noDataRange'))+'</div>'; return; }
  h += '<div class="stats">'+
    '<div class="stat main"><div class="k">'+esc(t('avg'))+'（'+st.n+' '+esc(t('readings'))+'）</div><div class="v"'+hiCls(st.s,st.d)+'>'+bpTxt(st.s,st.d)+' <small>mmHg</small></div></div>'+
    '<div class="stat"><div class="k">☀ '+esc(t('amAvg'))+'</div><div class="v"'+hiCls(st.amS,st.amD)+'>'+bpTxt(st.amS,st.amD)+'</div><div class="k">'+st.amN+' '+esc(t('readings'))+'</div></div>'+
    '<div class="stat"><div class="k">☾ '+esc(t('pmAvg'))+'</div><div class="v"'+hiCls(st.pmS,st.pmD)+'>'+bpTxt(st.pmS,st.pmD)+'</div><div class="k">'+st.pmN+' '+esc(t('readings'))+'</div></div>'+
    '<div class="stat"><div class="k">'+esc(t('pulseAvg'))+'</div><div class="v">'+(st.p==null?'–':st.p)+'</div><div class="k">'+esc(t('bpm'))+'</div></div>'+
    '<div class="stat"><div class="k">'+esc(t('overTarget'))+'</div><div class="v">'+st.overPct+'<small>%</small></div><div class="k">'+st.over+'/'+st.n+'</div></div>'+
    '<div class="stat"><div class="k">'+esc(t('maxBp'))+'</div><div class="v hi" style="font-size:22px">'+st.max.s+'/'+st.max.d+'</div><div class="k">'+fDate(st.max.t)+' '+fTime(st.max.t)+'</div></div>'+
    '<div class="stat"><div class="k">'+esc(t('dayCount'))+'</div><div class="v">'+st.days+'</div><div class="k">'+(st.irr? '⚠ '+esc(t('irrLbl'))+' ×'+st.irr : '&nbsp;')+'</div></div>'+
    '</div>';
  var svg = chartSVG(a);
  if (svg) h += '<h3 style="font-size:16px;margin:14px 0 4px">'+esc(t('chartTitle'))+'</h3>'+
    '<div class="legend"><span><i style="background:var(--sys)"></i>'+esc(t('lgSys'))+'</span><span><i style="background:var(--dia)"></i>'+esc(t('lgDia'))+'</span><span><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)"></i>'+esc(t('lgTarget'))+'</span></div>'+svg;
  h += '<h3 style="font-size:16px;margin:14px 0 4px">'+esc(t('dailyTable'))+'</h3>'+
    '<table class="days"><thead><tr><th>'+esc(t('date'))+'</th><th>☀ '+esc(t('amShort'))+'</th><th>☾ '+esc(t('pmShort'))+'</th><th style="text-align:left">'+esc(t('notesLbl'))+'</th></tr></thead><tbody>'+dailyRows(a)+'</tbody></table>'+
    '<p class="print-only small muted">'+esc(t('generated'))+' '+fDateY(Date.now())+' '+fTime(Date.now())+' · '+esc(t('appName'))+'</p>';
  $('reportCard').innerHTML = h;
}

function summaryText(){
  var a = inRange(), st = computeStats(a), tg = target(), p = S.profile, L=[];
  L.push(t('summaryHead')+(p.name?' '+p.name:''));
  if (a.length) L.push(t('period')+'：'+fDateY(a[a.length-1].t)+' – '+fDateY(a[0].t)+'，'+st.n+' '+t('readings')+'，'+st.days+' '+t('days'));
  L.push(t('avg')+'：'+bpTxt(st.s,st.d)+'（'+t('targetLbl')+' '+tg.s+'/'+tg.d+'）');
  L.push(t('amAvg')+'：'+bpTxt(st.amS,st.amD)+'；'+t('pmAvg')+'：'+bpTxt(st.pmS,st.pmD));
  if (st.p!=null) L.push(t('pulseAvg')+'：'+st.p);
  if (st.max) L.push(t('maxBp')+'：'+st.max.s+'/'+st.max.d+'（'+fDate(st.max.t)+' '+fTime(st.max.t)+'）');
  L.push(t('overTarget')+'：'+st.overPct+'%');
  if (p.meds) L.push(t('medsLbl')+'：'+p.meds.replace(/\n/g,'；'));
  L.push('');
  a.slice().reverse().forEach(function(r){ L.push(fDate(r.t)+' '+fTime(r.t)+'  '+r.s+'/'+r.d+(r.p?'  ♥'+r.p:'')+(r.note?'  '+r.note:'')); });
  return L.join('\n');
}
$('shareTextBtn').addEventListener('click', function(){
  var txt = summaryText();
  if (navigator.share){ navigator.share({title:t('report'), text:txt}).catch(function(){}); return; }
  copyText(txt);
});
function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast(t('copied')); }, function(){ fallbackCopy(txt); }); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(t('copied')); }catch(e){} document.body.removeChild(ta); }
$('printBtn').addEventListener('click', function(){ renderReport(); window.print(); });
$('fullBtn').addEventListener('click', function(){
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  $('reportCard').scrollIntoView({behavior:'smooth'});
});

function saveFile(name, mime, content){
  var blob = new Blob([content], {type:mime});
  try {
    var file = new File([blob], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(function(){}); return; }
  } catch(e){}
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(t('exported'));
}
function stamp(){ var d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
$('csvBtn').addEventListener('click', function(){
  var q=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  var rows=[['Date','Time','Session','SYS','DIA','Pulse','Medicine','Irregular','Note']];
  inRange().slice().reverse().forEach(function(r){ var d=new Date(r.t);
    rows.push([d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), fTime(r.t), isAM(r.t)?'AM':'PM', r.s, r.d, r.p||'', r.med?'Y':'', r.irr?'Y':'', r.note||'']); });
  saveFile('BP-'+stamp()+'.csv', 'text/csv', '﻿'+rows.map(function(r){ return r.map(q).join(','); }).join('\r\n'));
});

/* ---------------- settings ---------------- */
function bindProfile(id, key, isNum){
  var el=$(id);
  el.addEventListener('input', function(){ var v=el.value; if (isNum){ v=v.replace(/[^\d]/g,''); el.value=v; v = v? parseInt(v,10): (key==='ts'?130: key==='td'?80: ''); } S.profile[key]=v; persist(); });
  el.addEventListener('blur', function(){ fillProfile(); });
}
function fillProfile(){ var p=S.profile; $('pfName').value=p.name||''; $('pfBirth').value=p.birth||''; $('pfMeds').value=p.meds||''; $('pfTS').value=p.ts||130; $('pfTD').value=p.td||80; }
bindProfile('pfName','name'); bindProfile('pfBirth','birth'); bindProfile('pfMeds','meds'); bindProfile('pfTS','ts',true); bindProfile('pfTD','td',true);

$('exportBtn').addEventListener('click', function(){
  saveFile('BP-backup-'+stamp()+'.json', 'application/json', JSON.stringify({app:'bplog', v:1, exported:new Date().toISOString(), profile:S.profile, readings:S.readings}));
});
$('importBtn').addEventListener('click', function(){ $('importFile').click(); });
$('importFile').addEventListener('change', function(){
  var f=this.files && this.files[0]; if(!f) return; var rd=new FileReader();
  rd.onload=function(){
    try {
      var o=JSON.parse(rd.result); if (!o || !Array.isArray(o.readings)) throw 0;
      var have={}; S.readings.forEach(function(r){ have[r.id]=1; }); var n=0;
      o.readings.forEach(function(r){ if (r && r.id && !have[r.id] && +r.t && +r.s && +r.d){ S.readings.push({id:String(r.id),t:+r.t,s:+r.s,d:+r.d,p:r.p?+r.p:undefined,med:!!r.med||undefined,irr:!!r.irr||undefined,note:r.note?String(r.note).slice(0,200):undefined}); n++; } });
      if (o.profile && !S.profile.name) S.profile = Object.assign(S.profile, o.profile);
      persist(); fillProfile(); renderAll(); toast(t('imported').replace('{n}', n), 3000);
    } catch(e){ toast(t('importErr'), 3000); }
  };
  rd.readAsText(f); this.value='';
});
$('wipeBtn').addEventListener('click', function(){
  if (!confirm(t('confirmWipe'))) return; if (!confirm(t('confirmWipe2'))) return;
  S.readings=[]; persist(); renderAll(); toast(t('deleted'));
});
function renderTheme(){
  var opts=[['auto',t('themeAuto')],['light',t('themeLight')],['dark',t('themeDark')]];
  $('themeChips').innerHTML = opts.map(function(o){ return '<button type="button" class="chip'+(S.theme===o[0]?' on':'')+'" data-th="'+o[0]+'">'+esc(o[1])+'</button>'; }).join('');
  if (S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
}
$('themeChips').addEventListener('click', function(e){ var b=e.target.closest('.chip'); if(!b) return; S.theme=b.getAttribute('data-th'); persist(); renderTheme(); });

/* install */
var deferredPrompt = null;
var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt=e; renderInstall(); });
$('installBtn').addEventListener('click', function(){ if(!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; renderInstall(); }); });
function renderInstall(){
  if (standalone){ $('installCard').innerHTML = '<div style="color:var(--ok);font-weight:700">'+esc(t('installed'))+'</div>'; return; }
  $('installBtn').style.display = deferredPrompt ? '' : 'none';
  var steps = isIOS ? t('installIOS') : t('installAnd');
  $('installHow').innerHTML = '<ol class="howto">'+steps.map(function(s){ return '<li>'+s+'</li>'; }).join('')+'</ol>';
}

$('langBtn').addEventListener('click', function(){ lang = lang==='zh' ? 'en' : 'zh'; S.lang=lang; persist(); applyLang(); });

function renderAll(){ renderRecent(); if (current==='history') renderHistory(); if (current==='report') renderReport(); }

/* init */
fillProfile(); resetTime(); $('inMed').checked = medDefault();
applyLang();
if (!storageOK) toast(t('storageErr'), 6000);
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
